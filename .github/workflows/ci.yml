name: ci

on:
  push:
    branches: [main, master]    # master 兜底（push 策略 master:main 触发主分支；但 master 直推也接受）
    tags:
      - 'review/*'              # D-31 tag 模板（review/<milestone>-<sha7>）
  pull_request:
    branches: [main]
  workflow_dispatch:            # D-40 决策路径 1（用户手动触发 5 命令实跑）
    inputs:
      verify_pdf_path:
        description: 'verify 脚本用 PDF 路径'
        required: false
        default: 'materials/textbooks/选择性必修1.pdf'

jobs:
  backend:
    name: backend (lint + types + alembic + pytest + verify)
    runs-on: ubuntu-latest

    # M1-B retro 工单 B3：CI 门禁含 PG service + alembic upgrade + 真 pytest + 真 verify。
    # 决策室 D-37 二次独立审查需要「实跑证据」——5 个 step 全部退出码原文可追溯。
    #
    # PG fixture 设计：
    # - services.postgres 用 postgres:15-alpine + healthcheck pg_isready
    # - 容器内 host = `postgres`（GitHub Actions service 默认 DNS 名）
    # - 数据库 `tiered_homework_test` 与 dev box 区分（test 专用，CI 短生命周期）
    # - DATABASE_URL 用环境变量统一传递：alembic / pytest 都引用它
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiered_homework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # D-36-A 环境钉死（review 材料必含三锚）
      COMMIT_SHA: ${{ github.sha }}
      PYTHON_VERSION: '3.11'        # 与 prod 容器一致
      PG_VERSION: '15-alpine'        # 与 docker-compose 一致
      # 这些 env 必须在每个 step 输出 + CI artifact 里出现
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tiered_homework_test
      # CI 中 dev box 风格的 worker 跑不动 alembic + 真 LLM（B5 仍开）；
      # pytest 用 dummy key（mock_llm_provider 不需要真 key；D-32 教训）
      # verify 用 repo secret 里的真 key（infra agent 负责加）
      DEEPSEEK_API_KEY_PYTEST: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: ruff
        name: Ruff check (app + tests)
        working-directory: backend
        run: ruff check app tests

      # B1 mypy pre-existing（target_path = None assignment，line 407，0007 迁移后
      # 引入），不在本工单修复范围（brief 硬规则）；用 continue-on-error 不阻断
      # 后续步骤，让决策室看到原文。
      - id: mypy
        name: Mypy (app)
        working-directory: backend
        run: mypy app
        # B1 pre-existing 不再被吞；退出码 1 让决策室 review 看到原文

      # M1-B retro Step 1（2026-09-21）：alembic-prep step 已删。
      # 历史背景：N-2 失败模式——CI 脚手架掩盖 G2 迁移文件名 33 字符超过
      # alembic 默认 VARCHAR(32) 上限（StringDataRightTruncation）。
      # 删脚手架 + G2 rename 后：迁移 ID 字符数回到 32 以内，scaffold 无必要。
      # 决策依据：docs/decisions.md D-42 部署层失败模式防护 + D-36-B 机器证据。
      # M2-A.1 准入前置修复（2026-09-24）：HEAD CI run 7c87abd 实证 alembic upgrade
      # ❌ failed with "failed to resolve host 'postgres'"（services.postgres 容器
      # healthcheck 配了，但 DNS 传播瞬时失败 = race condition）。
      # 显式等 TCP 5432 可达（最多 30 × 2s = 60s）。
      # S1-⑨ 诊断（2026-09-24）：services.postgres 不可达调试。
      # S1-⑧ (44624f2) wait-postgres 修复未生效——60s 内 30 次 TCP 全失败。
      # 此前 run #17 (5ac7a62) alembic 同样报"failed to resolve host 'postgres'"。
      # 2 次 DNS 解析失败 = DNS 本身不通（不是 race condition）。
      # debug-postgres 步诊断：DNS 解析 / 进程监听 / 网络接口 / 多 probe 方法对比。
      # 此步**替换** wait-postgres（避免 60s 等待拖慢诊断）。
      - id: debug-postgres
        name: Debug postgres connectivity
        run: |
          echo "=== Environment ==="
          echo "DATABASE_URL: ${DATABASE_URL}"
          echo ""
          echo "=== /etc/hosts ==="
          cat /etc/hosts 2>&1 || echo "no /etc/hosts"
          echo ""
          echo "=== DNS resolution ==="
          echo "--- getent hosts postgres ---"
          getent hosts postgres 2>&1 || echo "FAIL"
          echo "--- nslookup postgres ---"
          nslookup postgres 2>&1 || echo "FAIL"
          echo "--- python socket.getaddrinfo ---"
          python3 -c "import socket; print(socket.getaddrinfo('postgres', 5432))" 2>&1 || echo "FAIL"
          echo ""
          echo "=== TCP connectivity ==="
          echo "--- bash /dev/tcp ---"
          (timeout 5 bash -c "echo > /dev/tcp/postgres/5432") 2>&1 || echo "FAIL /dev/tcp"
          echo "--- nc -zv ---"
          nc -zv postgres 5432 2>&1 || echo "FAIL nc"
          echo "--- curl telnet ---"
          curl -sv --max-time 5 telnet://postgres:5432 2>&1 | head -10 || echo "FAIL curl"
          echo ""
          echo "=== Postgres process ==="
          ps auxf 2>&1 | grep -i postgres | head -10 || echo "no postgres process"
          echo ""
          echo "=== Network interfaces ==="
          ip -4 addr 2>&1 | head -10 || echo "no ip"
          echo ""
          echo "=== Listening ports ==="
          ss -tln 2>&1 | head -20 || netstat -tln 2>&1 | head -20 || echo "no ss/netstat"
          echo ""
          echo "=== Python direct test ==="
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.settimeout(5)
          try:
              s.connect(('postgres', 5432))
              print('CONNECTED')
              s.close()
          except Exception as e:
              print(f'FAIL: {e}')
          "

      # M1-B retro 工单 B3：CI 必须真跑 alembic upgrade head 落到 PG
      # （不能只 collect），否则 conftest PG fixture 拿不到 schema。
      - id: alembic
        name: Alembic upgrade (PG)
        working-directory: backend
        run: alembic upgrade head

      # M1-B retro 工单 B3：CI 必须真跑 pytest（不是 collect-only）。
      # conftest.mock_db_engine 根据 DATABASE_URL 自动切 PG（CI）/ SQLite（本地 dev box）。
      - id: pytest
        name: Pytest (full run on PG)
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY_PYTEST }}
        run: pytest -q

      # M1-B retro 工单 B3：CI 真 verify 5 章节 LLM 真值（B.3.2 验收门槛）。
      # verify 脚本走 HTTP 调 API（thp-backend 在 CI job 内启动，见下）。
      # DEEPSEEK_API_KEY 走 repo secret（infra agent 负责加；本工单只 commit
      # 引用约定）。
      - id: backend-up
        name: Start backend (uvicorn, for verify step)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health || (cat /tmp/uvicorn.log; exit 1)

      - id: verify
        name: Verify end-to-end 5 chapters (real LLM, D-36-A env pin)
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tiered_homework_test
        run: |
          echo "=== D-36-A 环境钉死 ==="
          echo "COMMIT_SHA=${COMMIT_SHA}"
          echo "PYTHON_VERSION=${PYTHON_VERSION}"
          echo "PG_VERSION=${PG_VERSION}"
          python --version
          python -m scripts.verify_end_to_end_5_chapters \
            --pdf-path materials/teaching-guides/地理教师教学用书_选择性必修1.pdf

  frontend:
    name: frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Build
        env:
          VITE_API_PREFIX: /api
        run: npm run build