name: ci

on:
  push:
    branches: [main, master]    # master 兜底（push 策略 master:main 触发主分支；但 master 直推也接受）
    tags:
      - 'review/*'              # D-31 tag 模板（review/<milestone>-<sha7>）
  pull_request:
    branches: [main]
  workflow_dispatch:            # D-40 决策路径 1（用户手动触发 5 命令实跑）
    inputs:
      verify_pdf_path:
        description: 'verify 脚本用 PDF 路径'
        required: false
        default: 'materials/textbooks/选择性必修1.pdf'

jobs:
  backend:
    name: backend (lint + types + alembic + pytest + verify)
    runs-on: ubuntu-latest

    # M1-B retro 工单 B3：CI 门禁含 PG service + alembic upgrade + 真 pytest + 真 verify。
    # 决策室 D-37 二次独立审查需要「实跑证据」——5 个 step 全部退出码原文可追溯。
    #
    # PG fixture 设计（决策书 §二 根因正名，2026-09-26）：
    # - services.postgres 用 postgres:15-alpine + healthcheck pg_isready
    # - **真实访问方式**：workflow 无 `container:` 键 → service 在 host network → 必须用 `127.0.0.1`（不是 service hostname `postgres`）
    #   官方文档：https://docs.github.com/en/actions/using-containerized-services/about-service-containers#mapping-service-hostnames-to-labels
    #   2026-09-26 实证：CI run #20 dump = `getent hosts postgres` FAIL + `ps aux postgres` 显示进程在跑（UID 70）+ /etc/hosts 无 postgres 入口
    # - 数据库 `tiered_homework_test` 与 dev box 区分（test 专用，CI 短生命周期）
    # - DATABASE_URL 用环境变量统一传递：alembic / pytest / verify 都引用它（line 51 = 127.0.0.1）
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiered_homework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # D-36-A 环境钉死（review 材料必含三锚）
      COMMIT_SHA: ${{ github.sha }}
      PYTHON_VERSION: '3.11'        # 与 prod 容器一致
      PG_VERSION: '15-alpine'        # 与 docker-compose 一致
      # 这些 env 必须在每个 step 输出 + CI artifact 里出现
      DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ env.PG_HOST }}:5432/tiered_homework_test
      # host 由 wait-postgres 步写入 $GITHUB_ENV=PG_HOST（127.0.0.1 或 postgres hostname）
      # CI 中 dev box 风格的 worker 跑不动 alembic + 真 LLM（B5 仍开）；
      # pytest 用 dummy key（mock_llm_provider 不需要真 key；D-32 教训）
      # verify 用 repo secret 里的真 key（infra agent 负责加）
      DEEPSEEK_API_KEY_PYTEST: ci-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: ruff
        name: Ruff check (app + tests)
        working-directory: backend
        run: ruff check app tests

      # B1 mypy pre-existing（target_path = None assignment，line 407，0007 迁移后
      # 引入），不在本工单修复范围（brief 硬规则）。
      # 决策书 §一 §六 D-42 升级精神（2026-09-26）：平台行为真值优先——review6 §2.4
      # 实证 M2-A.0 mypy narrowing 在 py3.11 strict 下 EXIT=0 通过。
      # **继续 fail-fast**：任何后续引入 narrowing 错误必须立刻显形。
      - id: mypy
        name: Mypy (app)
        working-directory: backend
        run: mypy app
        # B1 pre-existing 不再被吞；退出码 1 让决策室 review 看到原文

      # M1-B retro Step 1（2026-09-21）：alembic-prep step 已删。
      # 历史背景：N-2 失败模式——CI 脚手架掩盖 G2 迁移文件名 33 字符超过
      # alembic 默认 VARCHAR(32) 上限（StringDataRightTruncation）。
      # M1-B retro G2 rename 移除了 alembic-prep scaffold；M2-A.0 起点（0007）= 14 字符 ≤32 上限 OK。
      # 决策书 §五：但 0005_drop_extraction_source_default = 35 字符 >32 上限 = 必爆 StringDataRightTruncation。
      # 修复见 alembic/versions/0005 缩短（+本 commit item 7）。
      # 决策依据：docs/decisions.md D-42 部署层失败模式防护 + D-36-B 机器证据。
      # M2-A.1 准入前置修复（2026-09-24）：HEAD CI run 7c87abd 实证 alembic upgrade
      # ❌ failed with "failed to resolve host 'postgres'"（services.postgres 容器
      # healthcheck 配了，但 DNS 传播瞬时失败 = race condition）。
      # S1-⑩ 真 wait-postgres（2026-09-26）—— 替换 debug-postgres（5ce46442 0s 失实）。
      # 多 probe 方法（DNS / TCP / Python socket）+ fail-fast exit 1。
      # debug-postgres 设计错误：脚本没 exit 1 = step 永远 ✓ 0s。
      # 真 wait-postgres 必须：任何 probe FAIL 立即 exit 1。
      # 不依赖 pg_isready / psycopg / nc 二进制（避免额外依赖）。
      - id: wait-postgres
        name: Wait for postgres ready (self-selecting host)
        run: |
          # 决策书 §五：自选式探针 — 两个 candidate + 失败 dump
          # D-43-X-2 升级：禁 2>/dev/null + 探针自证（不静默 stderr）
          for host in 127.0.0.1 postgres; do
            echo "--- Probing $host:5432 ---"
            if (timeout 5 bash -c "echo > /dev/tcp/$host/5432") 2>&1; then
              echo "PG_HOST=$host" >> "$GITHUB_ENV"
              echo "PG_PORT=5432" >> "$GITHUB_ENV"
              echo "Found working host: $host:5432"
              exit 0
            else
              echo "FAILED: $host:5432 unreachable"
            fi
          done
          echo "ERROR: neither 127.0.0.1 nor postgres reachable on port 5432"
          echo "=== Diagnostic dump (D-43-X-2 §3 必附证据) ==="
          echo "--- ss -tlnp ---"
          ss -tlnp 2>&1 || echo "ss not available"
          echo "--- docker ps -a ---"
          docker ps -a 2>&1 || echo "docker not available"
          echo "--- /proc/self/cgroup ---"
          cat /proc/self/cgroup 2>&1 || echo "cgroup not available"
          echo "--- getent hosts postgres ---"
          getent hosts postgres 2>&1 || echo "FAIL getent"
          echo "--- /etc/hosts ---"
          cat /etc/hosts 2>&1
          echo "--- ps aux postgres ---"
          ps auxf | grep -i postgres | head -5 || echo "no postgres process"
          exit 1

      # M1-B retro 工单 B3：CI 必须真跑 alembic upgrade head 落到 PG
      # （不能只 collect），否则 conftest PG fixture 拿不到 schema。
      - id: alembic
        name: Alembic upgrade (PG)
        working-directory: backend
        run: alembic upgrade head

      # M1-B retro 工单 B3：CI 必须真跑 pytest（不是 collect-only）。
      # conftest.mock_db_engine 根据 DATABASE_URL 自动切 PG（CI）/ SQLite（本地 dev box）。
      - id: pytest
        name: Pytest (full run on PG)
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY_PYTEST }}
        run: pytest -q

      # M1-B retro 工单 B3：CI 真 verify 5 章节 LLM 真值（B.3.2 验收门槛）。
      # verify 脚本走 HTTP 调 API（thp-backend 在 CI job 内启动，见下）。
      # DEEPSEEK_API_KEY 走 repo secret（infra agent 负责加；本工单只 commit
      # 引用约定）。
      - id: backend-up
        name: Start backend (uvicorn, for verify step)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health || (cat /tmp/uvicorn.log; exit 1)

      - id: verify
        name: Verify end-to-end 5 chapters (real LLM, D-36-A env pin)
        if: github.event_name == 'workflow_dispatch'
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DATABASE_URL inherits from job env（line 51 已改 127.0.0.1）
        run: |
          echo "=== D-36-A 环境钉死 ==="
          echo "COMMIT_SHA=${COMMIT_SHA}"
          echo "PYTHON_VERSION=${PYTHON_VERSION}"
          echo "PG_VERSION=${PG_VERSION}"
          python --version
          python -m scripts.verify_end_to_end_5_chapters \
            --pdf-path materials/teaching-guides/地理教师教学用书_选择性必修1.pdf

  frontend:
    name: frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Build
        env:
          VITE_API_PREFIX: /api
        run: npm run build