name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (lint + types + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115.0" \
            "uvicorn[standard]>=0.32.0" \
            "sqlalchemy>=2.0.36" \
            "psycopg[binary]>=3.2.3" \
            "alembic>=1.14.0" \
            "pymupdf>=1.24.0" \
            "pdfplumber>=0.11.0" \
            "httpx>=0.27.0" \
            "pydantic>=2.9.0" \
            "pydantic-settings>=2.6.0" \
            "ruff>=0.7.0" \
            "mypy>=1.13.0" \
            "pytest>=8.3.0" \
            "pytest-asyncio>=0.24.0"

      - name: Ruff check
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
        run: pytest -q

  frontend:
    name: frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Build
        env:
          VITE_API_PREFIX: /api
        run: npm run build
