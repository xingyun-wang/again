# docker-compose.yml — M0 一键启动（PostgreSQL 15 + FastAPI backend + nginx + frontend）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 看日志：docker compose logs -f backend

name: tiered-homework-m0

services:
  postgres:
    image: postgres:15-alpine
    container_name: thp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiered_homework
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - thp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiered_homework"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # 资源限制（M1-A 阶段 3 落地）。docker compose v2 用 deploy.resources，
    # 不要写在顶层 resources（旧版语法在 v2 不识别）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thp-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/tiered_homework
      APP_ENV: development
      APP_VERSION: "0.1.0"
      CORS_ORIGINS: "http://localhost:5173,http://localhost"
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-replace-me}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_CHAT_MODEL: deepseek-chat
      DEEPSEEK_EMBEDDING_MODEL: deepseek-embedding
      # M2 工单 A：教材 PDF 原件落盘路径（容器内路径；与 host bind 一一对应）
      UPLOADS_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # M2 工单 A：教材 PDF 原件落盘（M1-B B.3 阶段用 uploaded:{name}.pdf
      # 假路径代替真路径，是 P0-2 造假源头；现在改真 bind mount，container
      # 写 /app/data/uploads/{textbook_id}/{filename}.pdf = host 的
      # ./data/uploads/{textbook_id}/{filename}.pdf）。
      # 业务接口约定（与工单 C 共享）：service 写 uploads/{textbook_id}/{filename}.pdf。
      - ./data/uploads:/app/data/uploads
    networks:
      - thp-net
    # 资源限制（M1-A 阶段 3 落地）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # 启动链：先 alembic upgrade head（建表），再 exec uvicorn。
    # exec 让 uvicorn 继承 PID 1 —— docker stop 时正常收 SIGTERM，graceful shutdown。
    # 注释：alembic 必须在 uvicorn 之前跑，否则 backend 表不存在，uvicorn 起不来 / 路由全 500。
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 构建阶段可选：跳过默认值（前端不需要 LLM key）
        VITE_API_PREFIX: /api
    container_name: thp-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - thp-net
    # 资源限制（M1-A 阶段 3 落地）。frontend 是 nginx serve 静态，
    # CPU/内存都给得很小（nginx 默认 1 worker ≈ 几十 MB resident）
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # healthcheck：用 wget --spider（nginx:alpine 默认带 wget，不带 curl）。
    # 走 /healthz（nginx.conf 里直接返 200，不反代 backend）。
    # 关键：用 127.0.0.1 而非 localhost —— wget 默认 localhost 解析到 IPv6 [::1]，
    # 但 nginx:alpine 默认 listen 80 = IPv4 only（IPv6 编译进 nginx 但未启用 listen [::]:80），
    # wget 连 IPv6 会 Connection refused。
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  thp-net:
    driver: bridge

volumes:
  pgdata:
    name: thp-pgdata